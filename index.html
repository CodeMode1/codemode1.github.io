<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeMode1</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1f2328; --muted: #6a737d; --accent: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #4493f8; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 16px; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; font-size: 1.1rem; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>CodeMode1</h1>
    <p>Site under construction. Check back soon.</p>
    <a href="https://github.com/CodeMode1">github.com/CodeMode1</a>
  </main>
</body>
</html>
